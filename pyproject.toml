[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cda"
version = "0.1.0"
description = "CDA Project"
dependencies = [
    "fastapi",
    "uvicorn",
    "pyseto",
    "python-dotenv",
    "httpx",
    "aiosqlite",
    "streamlit",
]

requires-python = ">=3.9"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cda*"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "BLE", "SIM"]

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true