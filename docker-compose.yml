version: '3.8'

services:
  cda-control-plane:
    build: .
    container_name: cda_unified_server
    ports:
      - "8002:8002"
    environment:
      - PYTHONUNBUFFERED=1
      - CDA_SECRET_HEX=707172737475767778797a7b7c7d7e7f808182838485868788898a8b8c8d8e8f
    restart: unless-stopped

  cda-audit:
    build: .
    container_name: cda_audit_runner
    environment:
      - PYTHONUNBUFFERED=1
      - CDA_SECRET_HEX=707172737475767778797a7b7c7d7e7f808182838485868788898a8b8c8d8e8f
    command: ["./cda/scripts/run_full_audit.sh"]